# ComfyUI backed by autumn. Exported from the live Deployment (namespace
# autumn) on 2026-09-15, because the hand-written manifest this file used to
# hold had drifted: it was missing privileged/SYS_ADMIN (the FUSE mount needs
# both), the GPU limit, the cpu/memory limits and the eni-ip request, so
# applying it would have broken the workload.
#
# What the startup script does, in order: mount AutumnFS, bind models onto it,
# seed-and-bind custom_nodes/input/user/output so nodes and generated media
# survive a rollout, reinstall each node's pip deps (they live in the container
# layer, not on autumn), then exec ComfyUI with the Manager enabled.
#
# Home: this repo, next to docker/Dockerfile.autumn — changing the image
# usually means changing how it is deployed. Apply with the tag the pipeline
# produced (tag = the autumn-dev commit the run built):
#   sed "s|comfyui-autumn:c41f7a8f6f24d79a0a9523931e5a03f13444c6f2|\
#        dongmao-test-cn-beijing.cr.volces.com/dongmao-test/comfyui-autumn:<tag>|" \
#     k8s/comfyui-autumn.yaml | kubectl apply -f -
# Check `kubectl diff` first: live is the source of truth for anything patched
# outside this file.
#
# NOTE: the fusebin init pin (autumn-rs:633a4832…) is an embedded wire client
# like any other — it must move when the cluster's wire version moves.
apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/component: comfyui
    app.kubernetes.io/name: autumn
  name: comfyui-autumn
  namespace: autumn
spec:
  progressDeadlineSeconds: 600
  replicas: 1
  revisionHistoryLimit: 10
  selector:
    matchLabels:
      app.kubernetes.io/component: comfyui
      app.kubernetes.io/name: autumn
  strategy:
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 25%
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: comfyui
        app.kubernetes.io/name: autumn
    spec:
      containers:
      - args:
        - |-
          set -euo pipefail
          echo "NVIDIA_VISIBLE_DEVICES=${NVIDIA_VISIBLE_DEVICES:-}"
          export CUDA_VISIBLE_DEVICES="${NVIDIA_VISIBLE_DEVICES}"
          M="$(getent hosts autumn-manager | awk '{print $1}'):9001"
          echo "manager = $M"
          MP=/mnt/autumn
          MODEL_DIR=/opt/ComfyUI/models
          mkdir -p "$MP" "$MODEL_DIR"
          if grep -qs " $MODEL_DIR " /proc/mounts; then
            umount -l "$MODEL_DIR" 2>/dev/null || true
          fi
          if grep -qs " $MP fuse" /proc/mounts; then
            fusermount3 -uz "$MP" 2>/dev/null || umount -l "$MP" 2>/dev/null || true
          fi
          /opt/fusebin/autumn-fuse --manager "$M" --mountpoint "$MP" --transport tcp \
            --direct-read true \
            --read-io-threads 8 \
            --credential-file /etc/autumn/cred/fs.cred &
          FUSE_PID=$!
          trap 'umount -l /opt/ComfyUI/custom_nodes /opt/ComfyUI/input /opt/ComfyUI/user /opt/ComfyUI/output 2>/dev/null || true; umount -l /opt/ComfyUI/models 2>/dev/null || true; kill $FUSE_PID 2>/dev/null || true; fusermount3 -u /mnt/autumn 2>/dev/null || true' EXIT
          for i in $(seq 1 120); do
            ls "$MP/models" >/dev/null 2>&1 && break
            kill -0 $FUSE_PID 2>/dev/null || { echo "autumn-fuse exited during mount"; exit 1; }
            sleep 1
          done
          ls "$MP/models" >/dev/null 2>&1 || { echo "mount not serving $MP/models after 120s"; exit 1; }
          mount --bind "$MP/models" "$MODEL_DIR"
          echo "AutumnFS models mounted at $MODEL_DIR"
          ls "$MODEL_DIR/diffusion_models" | head -5 || true
          # custom_nodes / input / user / output live in autumn, not the
          # container layer, so rollouts keep them. The image ships stock
          # content for each; it is seeded once on first boot, after which
          # the FUSE copy is authoritative — nodes installed at runtime and
          # generated media survive pod replacement.
          seed_and_bind() {
            SRC=$1; DST=$2; SUB=$3
            mkdir -p "$MP/$SUB"
            if [ -z "$(ls -A "$MP/$SUB" 2>/dev/null)" ]; then
              cp -a "$SRC/." "$MP/$SUB/"
              echo "$SUB seeded from image"
            fi
            mount --bind "$MP/$SUB" "$DST"
            echo "$SUB mounted from AutumnFS: $DST"
          }
          seed_and_bind /opt/ComfyUI/custom_nodes /opt/ComfyUI/custom_nodes custom_nodes
          seed_and_bind /opt/ComfyUI/input       /opt/ComfyUI/input       input
          seed_and_bind /opt/ComfyUI/user        /opt/ComfyUI/user        user
          seed_and_bind /opt/ComfyUI/output      /opt/ComfyUI/output      output

          # Node code persists on autumn, but its pip deps live in the container
          # layer and vanish with the pod, so reinstall them every boot. ivolces
          # serves what it has at ~GB/s, aliyun covers the rest; the constraints
          # keep a node from swapping the base torch. Already-installed deps are a
          # no-op. A node that fails to resolve only warns — ComfyUI still starts
          # and reports the import error in its own log.
          for req in /opt/ComfyUI/custom_nodes/*/requirements.txt; do
            [ -f "$req" ] || continue
            echo "node deps: $req"
            uv pip install --system --break-system-packages \
              --index https://mirrors.ivolces.com/pypi/simple/ \
              --default-index https://mirrors.aliyun.com/pypi/simple/ \
              --index-strategy unsafe-best-match \
              -c /etc/pip-torch-constraints.txt -r "$req" \
              || echo "WARNING: node deps failed: $req"
          done

          mkdir -p /opt/ComfyUI/user/default/workflows /opt/ComfyUI/user/default/subgraphs
          [ -f /opt/ComfyUI/user/default/comfy.templates.json ] || printf '{}\n' > /opt/ComfyUI/user/default/comfy.templates.json
          exec python3 main.py --listen 0.0.0.0 --port 8188 --enable-manager
        command:
        - bash
        - -lc
        image: dongmao-test-cn-beijing.cr.volces.com/dongmao-test/comfyui-autumn:c41f7a8f6f24d79a0a9523931e5a03f13444c6f2
        imagePullPolicy: IfNotPresent
        name: comfyui
        ports:
        - containerPort: 8188
          name: http
          protocol: TCP
        resources:
          limits:
            cpu: '16'
            memory: 128Gi
            nvidia.com/gpu: '1'
            vke.volcengine.com/eni-ip: '1'
          requests:
            cpu: '8'
            memory: 64Gi
            nvidia.com/gpu: '1'
            vke.volcengine.com/eni-ip: '1'
        securityContext:
          capabilities:
            add:
            - SYS_ADMIN
          privileged: true
        volumeMounts:
        - mountPath: /dev/shm
          name: dshm
        - mountPath: /opt/fusebin
          name: fusebin
        - mountPath: /mnt/autumn
          name: mnt
        - mountPath: /etc/autumn/cred
          name: cred
          readOnly: true
      dnsPolicy: ClusterFirst
      enableServiceLinks: false
      initContainers:
      - args:
        - cp /usr/local/bin/autumn-fuse /fusebin/ && chmod +x /fusebin/autumn-fuse
        command:
        - sh
        - -c
        env:
        - name: CUDA_VISIBLE_DEVICES
          value: '1'
        image: dongmao-test-cn-beijing.cr.volces.com/dongmao-test/autumn-rs:633a4832de031848b34d971902c5aaac37be5f90
        imagePullPolicy: IfNotPresent
        name: fusebin
        resources:
          limits:
            cpu: '1'
            memory: 256Mi
          requests:
            cpu: '1'
            memory: 256Mi
        volumeMounts:
        - mountPath: /fusebin
          name: fusebin
      nodeSelector:
        kubernetes.io/hostname: 192.168.3.2
      restartPolicy: Always
      schedulerName: default-scheduler
      securityContext: {}
      terminationGracePeriodSeconds: 30
      volumes:
      - name: cred
        secret:
          defaultMode: 420
          secretName: autumn-credential
      - emptyDir:
          medium: Memory
          sizeLimit: 16Gi
        name: dshm
      - emptyDir: {}
        name: fusebin
      - emptyDir: {}
        name: mnt
